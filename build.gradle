plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

group = 'com.example'
version = '1.0.0'
archivesBaseName = 'example-mod'

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net') }
    maven { url = uri('https://libraries.minecraft.net') }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.5'  // Ensure this is the correct Minecraft version for your mod
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.119.5+1.21.5"  // Ensure this is the correct Fabric API version

    // Yarn mappings for your specific Minecraft version
    mappings 'net.fabricmc:yarn:1.21.5+build.4:v2'

    // Fabric Loom for building
    modCompile "net.fabricmc:fabric-loom:1.10.5"

    // Fabric loader (change version as necessary)
    compileOnly "net.fabricmc:fabric-loader:0.14.12"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)  // Use Java 21, as required for Minecraft 1.21+
    }
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
}
